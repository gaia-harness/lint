# pnpm settings. In pnpm 10.x+ only auth/registry settings are read from
# .npmrc; everything else (including supply-chain hardening) lives here.

# Supply-chain hardening; see https://pnpm.io/settings
# Delay installs until a published version has had time to be vetted.
# Value is in minutes; 4320 = 3 days. This mirrors the consuming GAIA app on
# purpose: because this config can only ever pin dependencies that have already
# cleared the 3-day window, every release of @gaia-harness/lint installs cleanly
# inside GAIA's own quarantine. GAIA exempts the @gaia-harness/lint package itself
# from its release-age check, but NOT lint's transitive deps; enforcing the
# window here is what keeps those deps pre-aged so no downstream exclusion is
# needed.
minimumReleaseAge: 4320

# Fail the install if a package's trust level has decreased vs prior releases.
trustPolicy: no-downgrade

# Acknowledge known-good packages that trip no-downgrade. Each is an old,
# pre-provenance release that is the correct, required version for its dependent.
# A newer MAJOR line later added npm provenance, so pnpm reads the older
# unattested release as a trust downgrade. These are not supply-chain
# regressions. Scope each exception to the exact version; no-downgrade stays
# enforced for everything else. semver and eslint-import-resolver-typescript sit
# in this config's published subtree, so the consuming GAIA app re-resolves and
# trips the same two; keep those in sync with GAIA. chokidar is a build-only
# dependency (via tsup) that is not shipped to consumers, so it is lint's alone;
# GAIA excludes the same version independently for its own toolchain.
#   - semver@6.3.1: final 6.x release; required by eslint-config-airbnb-extended
#     -> eslint-plugin-import (^6.3.1)
#   - eslint-import-resolver-typescript@3.10.1: final 3.x release; required by
#     eslint-plugin-canonical (^3.7.0)
#   - chokidar@4.0.3: final 4.x release; required by tsup (^4.0.3), dev/build only
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'eslint-import-resolver-typescript@3.10.1'
  - 'chokidar@4.0.3'

# Resolution settings. pnpm 11 reads these from pnpm-workspace.yaml, not .npmrc
# (which it consults only for auth/registry). savePrefix '' pins exact versions
# on `pnpm add`; pnpm 11 ignores the equivalent save-exact flag in .npmrc.
savePrefix: ''

# Build-script approval. pnpm 11 replaces the onlyBuiltDependencies allowlist
# with the allowBuilds map (true = the package may run install/build scripts).
# esbuild builds the platform binary tsup needs; unrs-resolver builds its native
# napi resolver. With strictDepBuilds on by default, an unlisted package that
# needs to build fails the install loudly instead of silently skipping.
allowBuilds:
  esbuild: true
  unrs-resolver: true
